version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: 3205-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      PER_JOB_CONCURRENCY: 5
      MAX_ARTIFICIAL_DELAY_MS: 0
      CANCEL_STRATEGY: abort
      REQUEST_TIMEOUT_MS: 10000
      JOB_TTL_MS: 86400000
      MAX_JOBS: 1000
      CLEANUP_INTERVAL_MS: 60000
      SHUTDOWN_TIMEOUT_MS: 10000
    networks:
      - 3205-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: 3205-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - 3205-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  3205-network:
    driver: bridge
